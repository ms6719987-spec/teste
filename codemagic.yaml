workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Show Xcode project and schemes
        script: |
          xcodebuild -list -project "ThreeOneOSFive.xcodeproj"
      - name: Build unsigned iOS app
        script: |
          set -e
          xcodebuild \
            -project "ThreeOneOSFive.xcodeproj" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="build/Build/Products/Release-iphoneos/3105.app"
          test -d "$APP_PATH"
          rm -rf Payload external-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry external-unsigned.ipa Payload
    artifacts:
      - external-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
