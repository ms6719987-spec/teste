workflows:
  ios-release:
    name: 3105 iOS Release
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_SCHEME: "3105"
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build archive
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
