workflows:
  ios_unsigned_ipa:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        XCODE_PROJECT: "ThreeOneOSFive.xcodeproj"
        XCODE_TARGET: "3105"
    scripts:
      - name: Show Xcode project targets
        script: |
          xcodebuild -list -project "$XCODE_PROJECT"
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$CM_BUILD_DIR/build" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$CM_BUILD_DIR/build/Build/Products/Release-iphoneos/3105.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App não encontrado em: $APP_PATH"
            echo "Apps encontrados:"
            find "$CM_BUILD_DIR/build/Build/Products" -maxdepth 3 -name '*.app' -print || true
            exit 1
          fi
          mkdir -p "$CM_BUILD_DIR/ipa/Payload"
          cp -R "$APP_PATH" "$CM_BUILD_DIR/ipa/Payload/3105.app"
          (cd "$CM_BUILD_DIR/ipa" && /usr/bin/zip -qry "$CM_BUILD_DIR/External-unsigned.ipa" Payload)
    artifacts:
      - External-unsigned.ipa
      - build/Build/Products/Release-iphoneos/*.app
