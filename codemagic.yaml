workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      vars:
        BUNDLE_ID: com.apple.mobile.MobileHouseArrest
    scripts:
      - name: Compilar app sem assinatura
        script: |
          set -e
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/Release-iphoneos"
    artifacts:
      - $CM_BUILD_DIR/build/Release-iphoneos/3105.app
