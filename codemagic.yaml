workflows:
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    environment:
      xcode: 26.6
      vars:
        BUNDLE_ID: com.apple.mobile.MobileHouseArrest
    scripts:
      - name: Compilar app sem assinatura
        script: |
          set -e
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme 3105 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build \
            CONFIGURATION_BUILD_DIR="$CM_BUILD_DIR/build/Release-iphoneos"
      - name: Empacotar IPA
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/Release-iphoneos/External.app"
          PAYLOAD="$CM_BUILD_DIR/build/Payload"
          IPA_PATH="$CM_BUILD_DIR/build/External.ipa"
          rm -rf "$PAYLOAD" "$IPA_PATH"
          mkdir -p "$PAYLOAD"
          cp -R "$APP_PATH" "$PAYLOAD/External.app"
          cd "$CM_BUILD_DIR/build"
          /usr/bin/zip -qry "$IPA_PATH" Payload
          test -f "$IPA_PATH"
          echo "IPA criado: $IPA_PATH"
    artifacts:
      - $CM_BUILD_DIR/build/External.ipa
